name: Apply reviewed v18 diagram colors

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v18.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed color changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              (
                  '.diagram-box-hi{fill:color-mix(in srgb,var(--accent) 7%,var(--surface));stroke:color-mix(in srgb,var(--accent) 40%,var(--border))}',
                  '.diagram-box-hi{fill:color-mix(in srgb,var(--muted) 4%,var(--surface));stroke:var(--border)}'
              ),
              (
                  '.diagram-box-low{fill:color-mix(in srgb,var(--accent2) 7%,var(--surface));stroke:color-mix(in srgb,var(--accent2) 40%,var(--border))}',
                  '.diagram-box-low{fill:color-mix(in srgb,var(--muted) 7%,var(--surface));stroke:var(--border)}'
              ),
              (
                  '.diagram-mix{fill:var(--accentsoft);stroke:color-mix(in srgb,var(--accent) 35%,var(--border));stroke-width:1.5}',
                  '.diagram-mix-gas{fill:color-mix(in srgb,var(--accent) 8%,var(--surface));stroke:color-mix(in srgb,var(--accent) 48%,var(--border));stroke-width:1.5}\n.diagram-mix-blood{fill:color-mix(in srgb,var(--accent2) 8%,var(--surface));stroke:color-mix(in srgb,var(--accent2) 48%,var(--border));stroke-width:1.5}'
              ),
              (
                  '<rect x="535" y="82" width="170" height="88" rx="13" class="diagram-mix"/>',
                  '<rect x="535" y="82" width="170" height="88" rx="13" class="diagram-mix-gas"/>'
              ),
              (
                  '<rect x="535" y="230" width="170" height="88" rx="13" class="diagram-mix"/>',
                  '<rect x="535" y="230" width="170" height="88" rx="13" class="diagram-mix-blood"/>'
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit reviewed v18
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v18.yml
          git add -- index.html
          git commit -m "Use neutral compartment colors"
          git push origin HEAD:main
